<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 18 105 95" width="420" height="380">
  <defs>
    <clipPath id="above-rim">
      <path d="M55 0 H160 V96.6 H146.4 A41 7.6 0 0 1 64.4 96.6 H55 Z" />
    </clipPath>
  </defs>
  <style>
  #hole{
    transform-box:fill-box;
    transform-origin:center;
    animation:hole-open 1.3s both;
  }
  @keyframes hole-open{
    0%   {transform:scale(0,0)}
    8%   {transform:scale(.06,.06); animation-timing-function:cubic-bezier(.3,0,.2,1)}
    38%  {transform:scale(1.08,.85); animation-timing-function:ease-in-out}
    50%  {transform:scale(.97,1.06); animation-timing-function:ease-out}
    58%  {transform:scale(1,1)}
    66%  {transform:scale(1.05,.9);  animation-timing-function:ease-out}
    80%  {transform:scale(.99,1.02)}
    100% {transform:scale(1,1)}
  }

  #rabbit-intro{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:emerge 1s .75s both;
  }
  @keyframes emerge{
    0%  {transform:translateY(85px) scale(1,1);      animation-timing-function:cubic-bezier(.25,.8,.4,1)}
    55% {transform:translateY(-3px) scale(.98,1.02); animation-timing-function:ease-in}
    75% {transform:translateY(0) scale(1.03,.97);    animation-timing-function:ease-out}
    100%{transform:translateY(0) scale(1,1)}
  }

  .crumb{
    opacity:0;
    animation:crumb .7s .88s cubic-bezier(.2,.6,.4,1) both;
  }
  @keyframes crumb{
    0%   {transform:translate(0,0);                                  opacity:0}
    10%  {opacity:1}
    45%  {transform:translate(var(--x), var(--y));                   animation-timing-function:ease-in}
    100% {transform:translate(calc(var(--x) * 1.7), 7px);            opacity:0}
  }

  .look{animation:look 11s ease-in-out 3.1s infinite}
  @keyframes look{
    0%, 30%   {transform:translateX(0)}
    34%, 46%  {transform:translateX(calc(var(--d) * -1))}
    50%, 62%  {transform:translateX(0)}
    66%, 80%  {transform:translateX(var(--d))}
    84%, 100% {transform:translateX(0)}
  }

  #rabbit{transform-box:fill-box;transform-origin:50% 100%;animation:hop 7s ease-in-out 1.75s infinite backwards}
  @keyframes hop{
    0%  {transform:translateY(2px) rotate(-1.5deg)}
    50% {transform:translateY(0px) rotate(1.5deg)}
    100%{transform:translateY(2px) rotate(-1.5deg)}
  }

  .eye{transform-box:fill-box;transform-origin:center;animation:blink 10s ease-in-out infinite}
  @keyframes blink{0%,98%,100%{transform:scaleY(1)}99%{transform:scaleY(.1)}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
    .crumb{opacity:0}
  }
</style>
  <ellipse id="hole" cx="105.4" cy="96.6" rx="44" ry="10.1" fill="#000" />
  <g clip-path="url(#above-rim)">
    <g id="rabbit-intro">
      <g id="rabbit" transform="translate(0 3)">
        <path fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round"
          stroke-linecap="round"
          d="M86 118
             L86 86
             C85.5 78 83.5 70 81.5 64
             C79 56 75.5 48 75 40
             C74.6 34 77 30.5 81 29.8
             C85 29.2 88.5 31.8 91.5 36
             C96 42.5 99 51 100 60
             C100.7 66 100.6 70 100.6 74.7
             Q103.5 73.3 106.6 72.9
             C106.8 64 106.6 52 106.3 42
             C106.1 34 107 27 111.8 25.8
             C116.5 24.8 120 28 121.6 32.5
             C124.4 40 124.8 52 124 62
             C123.4 68 122 73 121.2 77.6
             C123.3 80.5 126 85 127.2 89
             C127.8 93 127.8 98 127.8 118 Z" />
        <g class="look" style="--d:2.5px">
          <ellipse class="eye" cx="99.9" cy="91.2" rx="2" ry="2.9" fill="#000" />
          <ellipse class="eye" cx="117.8" cy="90.5" rx="2" ry="2.9" fill="#000" />
        </g>
        <g class="look" style="--d:0.6px">
          <path d="M99.6 75.2 Q107 70.6 114.6 74.4" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" />
        </g>
        <g class="look" style="--d:1.5px">
          <ellipse cx="109.4" cy="97.1" rx="2.6" ry="1.7" transform="rotate(-12 109.4 97.1)" fill="#000" />
        </g>
      </g>
    </g>
  </g>
  <g fill="#000">
    <circle class="crumb" cx="78"  cy="92" r="1.3" style="--x:-7px; --y:-9px;  animation-delay:.88s" />
    <circle class="crumb" cx="86"  cy="89" r="1"   style="--x:-4px; --y:-13px; animation-delay:.92s" />
    <circle class="crumb" cx="124" cy="89" r="1.1" style="--x:4px;  --y:-12px; animation-delay:.9s" />
    <circle class="crumb" cx="133" cy="92" r="1.4" style="--x:8px;  --y:-8px;  animation-delay:.86s" />
  </g>
</svg>