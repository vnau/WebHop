<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 18 105 92" width="420" height="368">
  <defs>
    <clipPath id="above-rim">
      <path id="rim-clip" d="M55 0 H160 V96.6 H127.9 A21 3.8 0 0 1 85.9 96.6 H55 Z" />
    </clipPath>
  </defs>
  <style>
  #hole{
    transform-box:fill-box;
    transform-origin:center;
    animation:hole-open 1.5s both;
  }
  @keyframes hole-open{
    0%   {transform:scale(0,0)}
    7%   {transform:scale(.08,.08); animation-timing-function:cubic-bezier(.3,0,.2,1)}
    32%  {transform:scale(1.08,.85); animation-timing-function:ease-in-out}
    44%  {transform:scale(.96,1.06); animation-timing-function:ease-out}
    53%, 80% {transform:scale(1,1); animation-timing-function:ease-out}
    85%  {transform:scale(1.08,1.2); animation-timing-function:ease-in-out}
    93%  {transform:scale(.98,.95)}
    100% {transform:scale(1,1)}
  }
  #hole-room{
    transform-box:fill-box;
    transform-origin:100% 50%;
    animation:make-room 1.5s both;
  }
  @keyframes make-room{
    0%, 30%  {transform:scale(1,1);       animation-timing-function:ease-out}
    50%, 68% {transform:scale(1.28,1.08); animation-timing-function:ease-in-out}
    82%,100% {transform:scale(1,1)}
  }
  #rim-clip{
    transform-origin:129.4px 96.6px;
    animation:rim-room 1.5s both;
  }
  @keyframes rim-room{
    0%, 30%  {transform:scaleX(1);    animation-timing-function:ease-out}
    50%, 68% {transform:scaleX(1.28); animation-timing-function:ease-in-out}
    82%,100% {transform:scaleX(1)}
  }

  .hole-strain{
    transform-box:fill-box;
    transform-origin:center;
    animation:hole-strain 9s ease-in-out 2s infinite;
  }
  @keyframes hole-strain{
    0%, 28%  {transform:scale(1,1)}
    32%      {transform:scale(1.07,1.18)}
    35%      {transform:scale(1.09,1.14)}
    38%      {transform:scale(1.07,1.2)}
    42%      {transform:scale(1.08,1.17); animation-timing-function:ease-in}
    45%      {transform:scale(.95,.9);    animation-timing-function:ease-out}
    50%      {transform:scale(1.02,1.04)}
    54%,100% {transform:scale(1,1)}
  }
  #hopper-stuck{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:emerge .9s .8s both;
  }
  @keyframes emerge{
    0%   {transform:translateY(85px) scale(1,1);       animation-timing-function:cubic-bezier(.25,.8,.4,1)}
    50%  {transform:translateY(0)    scale(.94,1.06);  animation-timing-function:ease-out}
    62%  {transform:translateY(6px)  scale(1.04,.95);  animation-timing-function:ease-in-out}
    80%  {transform:translateY(1.5px) scale(.99,1.01)}
    100% {transform:translateY(2.5px) scale(1,1)}
  }
  #hopper{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:struggle 9s ease-in-out 2s infinite;
  }
  @keyframes struggle{
    0%, 28%   {transform:translateY(0) scale(1,1) rotate(0)}
    32%       {transform:translateY(-3px) scale(.93,1.05) rotate(0)}
    34%       {transform:translateY(-3.5px) scale(.92,1.06) rotate(-2deg)}
    36%       {transform:translateY(-3px) scale(.93,1.05) rotate(2deg)}
    38%       {transform:translateY(-3.5px) scale(.92,1.06) rotate(-2deg)}
    40%       {transform:translateY(-3px) scale(.93,1.05) rotate(1.5deg)}
    42%       {transform:translateY(-3.5px) scale(.92,1.06) rotate(0); animation-timing-function:ease-in}
    45%       {transform:translateY(4px) scale(1.04,.95) rotate(0);    animation-timing-function:ease-out}
    50%       {transform:translateY(-.5px) scale(1,1) rotate(0)}
    54%, 66%  {transform:translateY(0) scale(1,1) rotate(0)}
    74%, 84%  {transform:translateY(3px) scale(1,1) rotate(-1deg)}
    92%, 100% {transform:translateY(0) scale(1,1) rotate(0)}
  }

  .look{animation:look 11s ease-in-out 2.4s infinite}
  @keyframes look{
    0%, 30%   {transform:translateX(0)}
    34%, 46%  {transform:translateX(calc(var(--d) * -1))}
    50%, 62%  {transform:translateX(0)}
    66%, 80%  {transform:translateX(var(--d))}
    84%, 100% {transform:translateX(0)}
  }

  .eye{transform-box:fill-box;transform-origin:center;animation:blink 10s ease-in-out infinite}
  @keyframes blink{0%,98%,100%{transform:scaleY(1)}99%{transform:scaleY(.1)}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
    #hopper-stuck{transform:translateY(2.5px)}
  }
  </style>
  <g class="hole-strain">
    <g id="hole-room">
      <ellipse id="hole" cx="106.9" cy="96.6" rx="22.5" ry="5.27" fill="#000" />
    </g>
  </g>
  <g clip-path="url(#above-rim)">
    <g id="hopper-stuck">
      <g transform="translate(0 3)">
        <g id="hopper">
          <path fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round"
            stroke-linecap="round"
            d="M86 118
              L86 86
              C85.5 78 83.5 70 81.5 64
              C79 56 75.5 48 75 40
              C74.6 34 77 30.5 81 29.8
              C85 29.2 88.5 31.8 91.5 36
              C96 42.5 99 51 100 60
              C100.7 66 100.6 70 100.6 74.7
              Q103.5 73.3 106.6 72.9
              C106.8 64 106.6 52 106.3 42
              C106.1 34 107 27 111.8 25.8
              C116.5 24.8 120 28 121.6 32.5
              C124.4 40 124.8 52 124 62
              C123.4 68 122 73 121.2 77.6
              C123.3 80.5 126 85 127.2 89
              C127.8 93 127.8 98 127.8 118 Z" />

          <g class="look" style="--d:2.5px">
            <ellipse class="eye" cx="99.9" cy="91.2" rx="2" ry="2.9" fill="#000" />
            <ellipse class="eye" cx="117.8" cy="90.5" rx="2" ry="2.9" fill="#000" />
          </g>
          <g class="look" style="--d:0.6px">
            <path d="M99.6 75.2 Q107 70.6 114.6 74.4" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" />
          </g>
          <g class="look" style="--d:1.5px">
            <ellipse cx="109.4" cy="97.1" rx="2.6" ry="1.7" transform="rotate(-12 109.4 97.1)" fill="#000" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>