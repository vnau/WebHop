name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - run: dotnet build WebHop.sln -c Release

      - name: Test with coverage
        run: >
          dotnet test WebHop.Tests -c Release -p:ContinuousIntegrationBuild=false
          --collect:"XPlat Code Coverage" --results-directory coverage

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: false

      # Packs on every build so packaging errors show up before a release.
      - run: dotnet pack WebHop.sln -c Release --no-build -o packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
